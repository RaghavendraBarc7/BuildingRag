# Theme for the HR Policy Assistant: warm paper surface, ink text, one evergreen accent for actions.
[theme]
base = "light"
primaryColor = "#2F6B57"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EFE9"
# Kept very dark on purpose: Streamlit fades this to 60% for captions and placeholders, which must stay readable.
textColor = "#121412"
linkColor = "#2F6B57"
codeBackgroundColor = "#F1EFE9"
borderColor = "#E2DED4"
showWidgetBorder = true
baseRadius = "0.75rem"

font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap"
baseFontSize = 16
headingFontSizes = ["2rem", "1.375rem", "1.125rem", "1rem", "1rem", "1rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]

[client]
# Hide developer-only menu items (like Deploy) so the app looks like a finished product.
toolbarMode = "viewer"
